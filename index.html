<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Disposable AppKeeper change-flow test site. No real orders or payments.">
  <title>Smoke Test Kitchen</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f8f5; color: #17362b; font: 16px/1.6 system-ui,sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 64px 24px; }
    .eyebrow { color: #087f5b; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1 { max-width: 650px; font-size: clamp(36px,6vw,64px); line-height: 1.1; margin: 20px 0; }
    .lead { max-width: 540px; color: #476658; font-size: 20px; }
    .order-button { display: inline-block; margin: 20px 0 40px; padding: 14px 24px; border-radius: 10px; background: #087f5b; color: white; font-size: 24px; font-weight: 700; text-decoration: none; }
    #menu { background: white; border: 1px solid #d8e8df; padding: 24px; border-radius: 16px; }
    footer { padding-top: 40px; font-size: 14px; color: #476658; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Smoke Test Kitchen</div>
    <h1>Fresh lunch, made simple.</h1>
    <p class="lead">A tiny, disposable website for testing an owner-approved button change.</p>
    <a class="order-button" id="order-now" href="#menu">Order now</a>
    <section id="menu"><h2>Today's menu</h2><p>Seasonal bowl · Garden salad · Fresh soup</p></section>
    <footer>Disposable test site — no orders, payments, accounts or customer data.</footer>
  </main>
</body>
</html>
